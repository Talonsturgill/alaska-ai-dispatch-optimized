brand:
  page_name: "Alaska.Ai"
  audience: "Alaskans who follow policy, infrastructure, and tech: legislators, staffers, utility execs, journalists, university researchers, tribal corporation staff, AK-based founders, engaged civic readers. Sophisticated but busy. Not Bay Area tech press."
  worldview:
    summary: "Alaska-first AND AI-first. We want Alaska and Alaskans to win, and we believe AI and ML are transformational technology that can help them do it. These are our values and starting lens, not a script: we read each story on its merits and earn the angle from the facts (see the angle room, dispatch routine Phase 3.5). We don't default to doom, and we don't default to boosterism."
    hold_at_once:
      - "AI/ML is genuinely transformational and can be a real advantage for Alaska: research, energy, fisheries, logistics, health, Indigenous-led capacity."
      - "We root for Alaska and Alaskans to come out ahead, and we celebrate it plainly when they do."
      - "We are not tone-deaf: AI infrastructure has real local costs, and nobody wants a data center in their backyard. Legitimate local opposition is legitimate, and we cover it with respect, not spin."
      - "All of these are true at the same time. Holding the optimism and the honest local concern together is the whole brand. Defaulting to doom or cynicism betrays it."
    default_lens: "Ask 'how could this help Alaska win, and what has to be true for it to' BEFORE 'what's the catch.' Skepticism is earned by facts, not applied reflexively. Techno-optimist, Alaska-partisan, honest."
  voice:
    one_line: "Analytical, policy-aware, takes positions, and fair. Names structural problems AND real wins. Like a state-legislature analyst writing for a smart, busy Alaskan reader: curious first, skeptical when the facts earn it."
    tone_words: [analytical, curious, even-handed, specific, structural, plainspoken, fair, contrarian-when-warranted]
    register: "Essayistic, not chatty. The voice of someone who has read the briefing book, credits what's good in it, and disagrees where it's wrong."
    stance_default: "Curious and even-handed, not suspicious. Skepticism is earned by the facts, never the default setting. Some stories are genuinely good news for Alaska; when they are, say so plainly and let them be good."
    do:
      - "Take a position. Don't hedge into mush."
      - "Cut both ways. Credit what genuinely works before naming what doesn't, and when a story is a real win or a genuinely cool capability, let it land as one instead of manufacturing a downside to sound smart."
      - "Lead with what's interesting or impressive, then earn any criticism with specifics. Do not default to a deflating 'but here's the catch' ending on every piece."
      - "Frame issues structurally. Name the binary, the false dichotomy, the missing option."
      - "Name specific entities, numbers, dates, agencies, bases, regions, dollar amounts."
      - "End with a real engagement question to readers, not a 'follow us' CTA."
      - "Plain English. Complex ideas in simple sentences."
      - "Never use em dashes or en dashes, ever. Write ranges as 'X to Y'. For a pause or aside use a comma, a period, parentheses, or a colon. Use straight quotes, not curly."
      - "ALWAYS use contractions over the formal register. NEVER write 'cannot', write \"can't\". Owner directive 2026-07-30, and it applies everywhere: captions and post copy above all, but also VO, on-screen labels, the Gmail draft and credits. 'cannot' reads as institutional writing, which is the opposite of this voice. ENFORCEMENT IS PARTIAL AND THAT IS STATED HONESTLY: scripts/caption_check.py (BANNED_FORMAL) hard-fails it in the LinkedIn POST TEXT ONLY, which is the highest-traffic surface. VO, on-screen labels, the Gmail draft and credits are NOT linted for it and are the writer's responsibility, same as the em-dash ban."
      - "Cite the source of a claim inline when it matters (e.g. 'briefed lawmakers last week')."
    dont:
      - "Don't use hashtags."
      - "Don't sign off with 'Follow Alaska.Ai for ...'. Ask a question instead."
      - "Never use em dashes or en dashes anywhere, including on-screen video text and captions. Zero exceptions."
      - "Don't open with 'Imagine ...', 'In an era where ...', or 'It's no secret that ...'"
      - "Don't use 'game-changer', 'revolutionize', 'disrupt', 'synergy', or 'leverage' (as verb)."
      - "Don't use emojis."
      - "Don't write 'we' or 'us' implying speaking for Alaskans. Speak about Alaska, not as Alaska."
      - "Don't invent quotes or numbers."
  date_format:
    # OWNER RULE 2026-08-05: "rn ur saying '10 August', the normal way to say it is August 10th."
    rule: "In any sentence a human READS OR HEARS, write the month name first and the day as an ordinal. August 10th. Never '10 August', never a bare 'August 10', never 'the 10th of August', never an abbreviated month in prose ('Aug 10')."
    good: ["August 10th", "July 3rd", "December 1st", "August 2026 (no day, so no ordinal needed)"]
    bad: ["10 August", "August 10", "Aug 10", "the 10th of August", "10th August"]
    applies_to: "VO, LinkedIn post copy, on-screen text that is a SENTENCE, the Gmail draft's prose, the weekly Facebook post."
    iso_is_still_correct_for: "filenames, ledger and JSON fields, and a PROVENANCE STAMP on screen or in a source list, where the date is a citation rather than a sentence. 'ANCHORAGE DAILY NEWS, 2026-08-02' under a masthead is a stamp and stays ISO. 'The paper ran it on August 2nd' is a sentence and takes the ordinal."
    enforced_by: "scripts/caption_check.py DATE_FORMS (hard fail on the post text). VO, on-screen labels and the Gmail draft are the writer's responsibility, same as the em-dash ban."

  comma_discipline:
    # OWNER RULE 2026-08-05: "reduce comma usage by 10% on the captions moving forward."
    rule: "Captions carry FEWER commas. The ceiling is 4.9 commas per 100 words of post body, which is 10 percent below the measured mean of every caption this channel had shipped as of 2026-08-05."
    measured_baseline: "18 shipped captions, mean 5.41 commas per 100 words, median 5.36, range 3.57 to 7.38. The 10 percent cut lands at 4.86, and the ceiling is set at 4.9."
    how_to_cut_them: "Do NOT just delete commas and leave a run-on, which trades a comma for a worse sentence. Split the sentence at the comma and let it be two sentences. Cut the introductory clause that was only there to be qualified. Drop the appositive that restates a noun the reader already has. This voice is already short and declarative, so the commas that go are almost always the ones bolting a second thought onto a finished one."
    enforced_by: "scripts/caption_check.py COMMA_PER_100W (hard fail on the post text)."

  banned_words:
    # Formal-register words with a mandatory contraction. Enforced in code by
    # scripts/caption_check.py > BANNED_FORMAL, not just documented here.
    cannot: "can't"
  banned_phrases:
    - "game-changer"
    - "revolutionize"
    - "disrupt"
    - "synergy"
    - "leverage"
    - "buckle up"
    - "let's dive in"
    - "in a world where"
    - "imagine if"
    - "it's no secret that"
    - "here is the honest part"
    - "here's the honest part"
    - "here's what matters"
    - "here is what matters"
    - "here's where the frame breaks"
    - "here is where the frame breaks"
  # SCOPE, made explicit 2026-08-04. Everything in this block describes the WEEKLY FACEBOOK
  # POST (the 280 to 420 word essay), not the daily LinkedIn Dispatch caption. A panel judge
  # read no_hashtags as global and raised the Dispatch's five hashtags as a brand violation
  # with caption_check.py failing to enforce its own config, which was a fair reading of an
  # ambiguous file: prompts/dispatch_routine.md requires the LinkedIn post body to END in
  # hashtags and scripts/caption_check.py validates 3 to 5 of them in the tail block, so the
  # two surfaces have had opposite rules and only one of them said which was which.
  applies_to: "facebook_weekly_post"
  length_target_words: [280, 420]
  ends_with: "engagement_question"
  no_hashtags: true          # FACEBOOK ONLY. LinkedIn Dispatch captions take 3 to 5, in the tail.
