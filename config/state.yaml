- date: '2026-08-12'
  topic: 'THE SMALLEST DOOR: on July 28th the Administration for Native Americans
    published 91 FR 47241 retiring SEDS and SEDS-Alaska. EAGLE succeeds them and is
    larger (24,000,000 dollars, 31 awards vs 2,000,000 and 3) but its floor is 300,000
    where SEDS-Alaska''s was 100,000, and EAGLE is national. The same notice created
    the AI3 Action Institute, one award nationwide, floor 2,500,000, closing August
    27th 2026, holding every AI dollar it made. What that award is paid to produce
    is a list of practical AI opportunities in Native communities. A 380,000 dollar
    NSF grant at UAA (award 2433241) already produced one for Alaska: twelve organizations
    named their own problems with no menu, four were funded including Nome Joint Utilities
    System (thermal conductivity of warming permafrost) and the Village of Alakanuk
    Tribe (infrastructure coordination), eight still hold an unpublished list. Position:
    the institute is not the mistake, retiring the small Alaska door in the same notice
    is. Falsifier stated on screen. No Alaska outlet covered it; found by primary-source
    mining. AFN quote KILLED (sole source 403s).'
