- date: '2026-08-06'
  topic: 'THE SAME FACE, THE SAME PLATE: two Alaska cities met the limits of AI in
    the same week. Anchorage weighs roughly $600,000 more for a Real-Time Crime Center
    built for UP TO 750 volunteered camera feeds (a capacity ceiling, not a live count);
    its 2023 ordinance HEAVILY LIMITS facial recognition (10-1, carve-outs, not an
    indefinite ban) and that rule holds, but the plate readers run object recognition,
    which is not the category the rule named, and the Assembly POSTPONED the contract
    to August 18th. Fairbanks put AI on redacting police body-camera video, has not
    named the tool, and its chief of staff told the council it is still too slow;
    requests went from never above 20 a month before October 2025 to more than 35
    in April and again in July, landing on ONE evidence technician under a five-staff-hour
    free-records rule that predates body cameras. The film''s actual AI insight: redaction
    is two jobs, finding and deciding, AI collapsed finding and never touched deciding,
    so the total barely moved. Fair beat: the chief of staff''s remedy was ONE official''s
    idea and the city''s own attorneys disagreed in the room.'
