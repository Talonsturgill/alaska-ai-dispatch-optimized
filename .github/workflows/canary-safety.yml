name: Canary safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fail-closed-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canary policy and origin
        run: python scripts/canary_guard.py self-test
      - name: Run canary guard regressions
        run: python -m unittest scripts/test_canary_guard.py
